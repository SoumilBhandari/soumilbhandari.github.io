<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soumil Bhandari — Scan</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<style>
  /* Deliberately light: QR scanners want dark modules on a light field, and
     this page gets shown on a laptop at a career-fair table or printed out. */
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:#faf9f7;
    color:#17150f;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    display:grid;place-items:center;
    padding:32px;
    text-align:center;
  }
  .sheet{max-width:520px}
  h1{margin:0 0 6px;font-size:clamp(28px,6vw,42px);font-weight:600;letter-spacing:-.02em}
  .role{margin:0;font-size:clamp(15px,3vw,18px);color:#5c574d}
  .qr{
    margin:32px auto 26px;
    width:min(64vw,340px);
    padding:20px;
    background:#fff;
    border:1px solid #e4e0d8;
    border-radius:20px;
    box-shadow:0 2px 24px rgba(0,0,0,.06);
  }
  .qr img{display:block;width:100%;height:auto}
  .cta{margin:0 0 4px;font-size:clamp(16px,3.4vw,19px);font-weight:550}
  .url{margin:0;font-size:14px;color:#8a8478;letter-spacing:.01em}
  .hint{margin-top:26px;font-size:13px;color:#a09a8e}

  @media print{
    @page{margin:14mm}
    body{background:#fff;padding:0}
    .qr{box-shadow:none;border-color:#ccc}
    .hint{display:none}
  }
</style>
</head>
<body>
  <div class="sheet">
    <h1>Soumil Bhandari</h1>
    <p class="role">AI Researcher at Perforated AI &middot; Computer Engineering @ Purdue</p>

    <div class="qr"><img src="qr.png" alt="QR code linking to soumilbhandari.github.io"></div>

    <p class="cta">Scan for my resume &amp; contact</p>
    <p class="url">soumilbhandari.github.io</p>

    <p class="hint">Tip: &#8984;P / Ctrl+P prints this as a table card.</p>
  </div>
</body>
</html>
